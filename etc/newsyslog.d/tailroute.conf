# tailroute.conf — Log rotation for tailroute daemon logs
#
# Format: logfile_name [owner:group] mode count size when [ZB] [/pid_file] [sig_num]
# See: man newsyslog.conf
#
# The daemon log path depends on the install layout (Homebrew prefix differs
# on Apple Silicon vs Intel); newsyslog skips absent files, so both prefixes
# and the legacy launchd sink are listed.
#
# Correction: the legacy v0.8.16 line used @midnight, which is NOT a valid
# when-field — newsyslog rejects it at parse time ("malformed 'at' value")
# and drops the whole entry. "when" fields here use $D0 (midnight), so
# rotation fires when the size limit is exceeded OR daily at midnight.
#
# No signal number is given: newsyslog renames/compresses without signalling
# the daemon, so the launchd-held stdout fd keeps writing into the renamed
# (archived) copy until the next daemon restart. This bounds active-path
# growth, not the archive.

/opt/homebrew/var/log/tailroute-daemon.log   root:admin 640 7 10240 $D0 Z
/usr/local/var/log/tailroute-daemon.log      root:admin 640 7 10240 $D0 Z
/var/log/tailroute.log                       root:wheel 644 7 10000 $D0 Z
