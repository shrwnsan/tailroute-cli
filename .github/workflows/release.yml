name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build tailroute-proxy (signed)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build for Darwin ARM64 (native)
        working-directory: proxy
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" \
            -o build/tailroute-proxy-darwin-arm64 .

      - name: Build for Darwin AMD64 (cross from macOS)
        working-directory: proxy
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" \
            -o build/tailroute-proxy-darwin-amd64 .

      # Go's linker adhoc-signs darwin/arm64 unconditionally, but NOT the
      # cross-compiled amd64 binary. arm64 macOS refuses to RUN unsigned
      # binaries, and tailroute's do_install() runs `codesign --verify` on
      # the proxy before installing it -- so sign both explicitly (adhoc)
      # and fail the release unless verification passes.
      - name: Adhoc-sign and verify
        working-directory: proxy/build
        run: |
          for bin in tailroute-proxy-darwin-arm64 tailroute-proxy-darwin-amd64; do
            /usr/bin/codesign --force --sign - "$bin"
            /usr/bin/codesign --verify --strict "$bin" || {
              echo "::error::$bin is not validly signed - release aborted" >&2
              exit 1
            }
            /usr/bin/codesign -dv "$bin" 2>&1 | grep -m1 "^Signature=" || true
          done

      - name: Generate SHA256 checksums
        working-directory: proxy/build
        run: |
          /usr/bin/shasum -a 256 tailroute-proxy-darwin-arm64 > tailroute-proxy-darwin-arm64.sha256
          /usr/bin/shasum -a 256 tailroute-proxy-darwin-amd64 > tailroute-proxy-darwin-amd64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailroute-proxy-binaries
          path: |
            proxy/build/tailroute-proxy-darwin-arm64
            proxy/build/tailroute-proxy-darwin-amd64
            proxy/build/tailroute-proxy-darwin-arm64.sha256
            proxy/build/tailroute-proxy-darwin-amd64.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tailroute-proxy-binaries
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: tailroute-proxy ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          generate_release_notes: true
          files: |
            artifacts/tailroute-proxy-darwin-arm64
            artifacts/tailroute-proxy-darwin-amd64
            artifacts/tailroute-proxy-darwin-arm64.sha256
            artifacts/tailroute-proxy-darwin-amd64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
